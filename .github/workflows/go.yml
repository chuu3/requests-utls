name: Go prototype
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            library: librequests_utls.so
            peer: requests-utls-testpeer
          - os: macos-latest
            library: librequests_utls.dylib
            peer: requests-utls-testpeer
          - os: windows-latest
            library: librequests_utls.dll
            peer: requests-utls-testpeer.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test native artifact packaging guards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/requests-utls ./cmd/peetcheck
      - run: go build -buildmode=c-shared -o dist/${{ matrix.library }} ./cmd/requests-utls-shared
      - run: go build -o dist/${{ matrix.peer }} ./cmd/requests-utls-testpeer
      - uses: actions/upload-artifact@v4
        with:
          name: requests-utls-abi1-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/${{ matrix.library }}
            dist/${{ matrix.peer }}
            include/requests_utls.h
            docs/abi.md
            profiles/chrome_152.json
            testdata/chrome_152_fingerprint.json
